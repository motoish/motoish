name: Update Mortgage Progress

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mortgage-progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update mortgage progress
        env:
          MORTGAGE_TOTAL: ${{ secrets.MORTGAGE_TOTAL }}
          MORTGAGE_BALANCE: ${{ secrets.MORTGAGE_BALANCE }}
        run: python3 scripts/update_mortgage_progress.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Mortgage progress has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: update mortgage progress"
          git push
